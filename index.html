<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Social Notes</title>

<style>
  :root {
    --bg-color: #f4f7f6;
    --text-color: #333;
    --card-bg: #ffffff;
    --border-color: #e0e0e0;
    --input-bg: #f9f9f9;
    --shadow: 0 4px 6px rgba(0,0,0,0.05);
    --accent: #007bff;
  }

  /* Dark Mode Variables */
  body.dark-mode {
    --bg-color: #1a1a1a;
    --text-color: #e0e0e0;
    --card-bg: #2d2d2d;
    --border-color: #444;
    --input-bg: #333;
    --shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
  
  /* Top Bar */
  .top-bar { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: var(--shadow); }
  .title-area h1 { margin: 0; font-size: 1.5rem; }
  .actions { display: flex; gap: 10px; }
  
  button { cursor: pointer; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; transition: transform 0.1s; }
  button:active { transform: scale(0.95); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #6c757d; color: white; }
  .btn-dark { background: #343a40; color: white; }
  .btn-export { background: #6610f2; color: white; }

  /* Search & Filter */
  .filter-section { margin-bottom: 20px; }
  .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 16px; margin-bottom: 10px; box-sizing: border-box;}
  
  .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
  .cat-pill { padding: 6px 15px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; cursor: pointer; white-space: nowrap; user-select: none; }
  .cat-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* Grid Layouts */
  .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
  
  /* Masonry for Images */
  .masonry-container { column-count: 3; column-gap: 15px; }
  @media (max-width: 900px) { .masonry-container { column-count: 2; } }
  @media (max-width: 600px) { .masonry-container { column-count: 1; } }

  /* Note Card Styling */
  .note-card { background: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: var(--shadow); position: relative; display: flex; flex-direction: column; gap: 10px; border: 2px solid transparent; margin-bottom: 15px; break-inside: avoid; transition: background 0.3s; }
  
  .note-header { display: flex; justify-content: space-between; align-items: center; }
  .cat-input { border: none; background: transparent; color: #888; font-size: 12px; font-weight: bold; text-transform: uppercase; width: 60%; cursor: pointer; }
  .cat-input:focus { outline: none; border-bottom: 1px solid var(--accent); }

  textarea { width: 100%; background: transparent; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; color: var(--text-color); font-family: inherit; resize: vertical; min-height: 80px; box-sizing: border-box; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

  /* Color Picker Dots */
  .color-palette { display: flex; gap: 5px; }
  .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
  .color-dot:hover { transform: scale(1.2); }

  /* Image Specific */
  .img-box { border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; border: 2px dashed var(--border-color); min-height: 150px; display: flex; align-items: center; justify-content: center; background: var(--input-bg); }
  .img-box img { width: 100%; height: auto; display: block; }
  .img-placeholder { padding: 20px; text-align: center; color: #888; font-size: 14px; }

  /* Delete Btn */
  .del-btn { background: #ff4d4d; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; padding: 0; opacity: 0; transition: opacity 0.2s; position: absolute; top: -8px; right: -8px; z-index: 5; }
  .note-card:hover .del-btn { opacity: 1; }

  /* Export Modal */
  #exportModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
  .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; text-align: center; }
  #exportText { width: 100%; height: 150px; margin-top: 10px; font-family: monospace; font-size: 12px; }

  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 3000; }
  .toast.show { opacity: 1; }

  /* Compact Mode */
  body.compact-mode .note-card { padding: 8px; gap: 5px; }
  body.compact-mode textarea { min-height: 40px; padding: 5px; font-size: 14px; }
  body.compact-mode .img-box { min-height: 100px; }
</style>
</head>

<div class="top-bar">

</div>

<div id="toast" class="toast">Copied!</div>

      "content": "১. সুয়েট ফ্রক এর প্রাইস রেঞ্জ - ৯৯৯ টাকা থেকে ১৪৫০ টাকা\n২. হুডি এর প্রাইস রেঞ্জ - ৬৫০ টাকা থেকে ১০৫০ টাকা\n৩. সুয়েট শার্ট এর প্রাইস রেঞ্জ - ৫৯৯ টাকা থেকে ৯২০ টাকা\n৪. জগার্স/প্যান্ট এর প্রাইস রেঞ্জ - ৫৯৯ টাকা থেকে ৮৫০ টাকা\n\nসাইজ অনুযায়ী প্রাইস হবে।\n২ টি নিলে ১ টি ফ্রি পাবেন",
      "category": "General",
      "color": "#bbdefb"
    },
    {
      "content": "২ টি ফ্রক নিলে আপনি সাথে আরও ১ টি ফ্রক পছন্দ মত এড করতে পারেন এর মধ্যে আপনি ১ টি ফ্রক ফ্রী পাবেন।",
      "category": "FROCK",
      "color": "#ffffff"
    },
    {
      "content": "এই ড্রেস কম্বো গুলো আছে। আপনি চাইলে এই ড্রেস কম্বো গুলো থেকে যেকোনো ড্রেস পছন্দ মত নিতে পারেন।",
      "category": "HOODIE",
      "color": "#e1bee7"
    },
    {
      "content": "আপনি ২ টি ফ্রক নিলেই BUY 2 GET 1 FREE (২টি ড্রেস এর সাথে ১টি ড্রেস ফ্রী ) অফার টি পাবেন।",
      "category": "FROCK",
      "color": "#ffffff"
    }
  ],
  "images": []
}
</script>
<script>
/* ------------------------------------------------
   INIT & DATA LOADING
------------------------------------------------ */
const textContainer = document.getElementById("textContainer");
const imageContainer = document.getElementById("imageContainer");
const catTabs = document.getElementById("catTabs");
const catList = document.getElementById("catList");

// Default Colors
const COLORS = ["#ffffff", "#ffcdd2", "#e1bee7", "#bbdefb", "#c8e6c9", "#fff9c4"];
// Dark Mode Equivalent Colors (subtle tints)
const DARK_COLORS = ["#2d2d2d", "#4a2c2e", "#3a2a3e", "#2a3642", "#2e4031", "#423e2a"];

let isDarkMode = false;
let isCompact = false;
let currentFilter = 'All';

window.onload = () => {
  // Load settings
  if(localStorage.getItem('darkMode') === 'true') toggleDark();
  if(localStorage.getItem('compactMode') === 'true') toggleCompact();

  let data = { texts: [], images: [] };
  
  // 1. Try JSON script
  try {
    const raw = document.getElementById("portable-data").textContent;
    data = JSON.parse(raw);
  } catch(e) { console.log("JSON Parse Error"); }

  // 2. Try LocalStorage if JSON is "empty" (just the default welcome msg)
  const localTxt = JSON.parse(localStorage.getItem("proNotesText") || "[]");
  const localImg = JSON.parse(localStorage.getItem("proNotesImg") || "[]");
  
  if (localTxt.length > 0 || localImg.length > 0) {
     // If user has worked locally, prefer that over the hardcoded HTML default
     data.texts = localTxt;
     data.images = localImg;
  }

  // 3. Render
  data.texts.forEach(t => renderTextCard(t.content, t.category, t.color));
  data.images.forEach(url => renderImageCard(url));

  updateCategories();
};

function saveData() {
  const texts = [];
  document.querySelectorAll("#textContainer .note-card").forEach(card => {
    texts.push({
      content: card.querySelector("textarea").value,
      category: card.querySelector(".cat-input").value.trim(),
      color: card.dataset.color || "#ffffff"
    });
  });

  const images = [];
  document.querySelectorAll("#imageContainer img").forEach(img => {
    images.push(img.src);
  });

  localStorage.setItem("proNotesText", JSON.stringify(texts));
  localStorage.setItem("proNotesImg", JSON.stringify(images));
  
  updateCategories();
}

/* ------------------------------------------------
   TEXT CARDS
------------------------------------------------ */
function renderTextCard(text = "", cat = "General", color = "#ffffff") {
  const div = document.createElement("div");
  div.className = "note-card";
  div.style.backgroundColor = isDarkMode ? getDarkColor(color) : color;
  div.dataset.color = color; // Store original color code

  // Header: Category Input
  const header = document.createElement("div");
  header.className = "note-header";
  const catInput = document.createElement("input");
  catInput.className = "cat-input";
  catInput.setAttribute("list", "catList");
  catInput.value = cat;
  catInput.placeholder = "CATEGORY";
  catInput.oninput = () => { saveData(); };
  header.appendChild(catInput);
  div.appendChild(header);

  // Body: Textarea
  const txt = document.createElement("textarea");
  txt.value = text;
  txt.placeholder = "Type note here...";
  txt.oninput = saveData;
  txt.onclick = () => {
    navigator.clipboard.writeText(txt.value);
    showToast("Text Copied!");
    div.style.outline = "2px solid #28a745";
    setTimeout(() => div.style.outline = "none", 400);
  };
  div.appendChild(txt);

  // Footer: Colors
  const palette = document.createElement("div");
  palette.className = "color-palette";
  COLORS.forEach(c => {
    const dot = document.createElement("div");
    dot.className = "color-dot";
    dot.style.backgroundColor = c;
    dot.onclick = () => {
      div.dataset.color = c;
      div.style.backgroundColor = isDarkMode ? getDarkColor(c) : c;
      saveData();
    };
    palette.appendChild(dot);
  });
  div.appendChild(palette);

  // Delete
  const del = document.createElement("button");
  del.className = "del-btn";
  del.innerHTML = "×";
  del.onclick = () => { if(confirm("Delete?")) { div.remove(); saveData(); } };
  div.appendChild(del);

  textContainer.appendChild(div);
}

function addTextCard() { renderTextCard("", "General", "#ffffff"); saveData(); }

/* ------------------------------------------------
   IMAGE CARDS (Masonry)
------------------------------------------------ */
function renderImageCard(src = "") {
  const div = document.createElement("div");
  div.className = "note-card";
  
  const box = document.createElement("div");
  box.className = "img-box";
  
  const img = document.createElement("img");
  const placeholder = document.createElement("div");
  placeholder.className = "img-placeholder";
  placeholder.innerText = "Click to Copy\nDouble-click to Edit URL";

  if(src) {
    img.src = src;
    placeholder.style.display = "none";
  } else {
    img.style.display = "none";
  }

  // Edit URL logic
  box.ondblclick = () => {
    const newUrl = prompt("Enter Image URL:", img.src);
    if(newUrl) {
      img.src = newUrl;
      img.style.display = "block";
      placeholder.style.display = "none";
      saveData();
    }
  };

  // Copy Logic
  box.onclick = async () => {
    if(!img.src) return;
    try {
        const response = await fetch(img.src);
        const blob = await response.blob();
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        showToast("Image Copied!");
    } catch(e) {
        alert("Could not copy automatically. Right click > Copy Image.");
    }
  };

  box.appendChild(img);
  box.appendChild(placeholder);
  div.appendChild(box);

  const del = document.createElement("button");
  del.className = "del-btn";
  del.innerHTML = "×";
  del.onclick = () => { if(confirm("Delete?")) { div.remove(); saveData(); } };
  div.appendChild(del);

  imageContainer.appendChild(div);
}

function addImageCard() {
    const url = prompt("Paste Image URL:");
    if(url) { renderImageCard(url); saveData(); }
}

/* ------------------------------------------------
   CATEGORIES & FILTERING
------------------------------------------------ */
function updateCategories() {
  const categories = new Set(["All"]);
  const cards = document.querySelectorAll("#textContainer .note-card");
  
  cards.forEach(c => {
    const cat = c.querySelector(".cat-input").value.trim() || "General";
    categories.add(cat);
  });

  // Rebuild Datalist
  catList.innerHTML = "";
  categories.forEach(c => {
    if(c !== "All") {
        const opt = document.createElement("option");
        opt.value = c;
        catList.appendChild(opt);
    }
  });

  // Rebuild Tabs
  catTabs.innerHTML = "";
  categories.forEach(c => {
    const pill = document.createElement("div");
    pill.className = `cat-pill ${c === currentFilter ? 'active' : ''}`;
    pill.innerText = c;
    pill.onclick = () => filterByCategory(c);
    catTabs.appendChild(pill);
  });
  
  filterNotes(); // Re-apply filter
}

function filterByCategory(cat) {
  currentFilter = cat;
  updateCategories(); // To update active class
}

function filterNotes() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const cards = document.querySelectorAll("#textContainer .note-card");

  cards.forEach(c => {
    const text = c.querySelector("textarea").value.toLowerCase();
    const cat = c.querySelector(".cat-input").value.trim() || "General";
    
    const matchesSearch = text.includes(search) || cat.toLowerCase().includes(search);
    const matchesCat = currentFilter === "All" || cat === currentFilter;

    c.style.display = (matchesSearch && matchesCat) ? "flex" : "none";
  });
}

/* ------------------------------------------------
   UTILITIES & EXPORT
------------------------------------------------ */
function toggleDark() {
  isDarkMode = !isDarkMode;
  document.body.classList.toggle("dark-mode", isDarkMode);
  localStorage.setItem("darkMode", isDarkMode);
  // Re-apply colors
  document.querySelectorAll(".note-card").forEach(c => {
      if(c.dataset.color) {
          c.style.backgroundColor = isDarkMode ? getDarkColor(c.dataset.color) : c.dataset.color;
      }
  });
}

function toggleCompact() {
    isCompact = !isCompact;
    document.body.classList.toggle("compact-mode", isCompact);
    localStorage.setItem("compactMode", isCompact);
}

function getDarkColor(hex) {
    // Simple mapping: if white, become dark grey. Else dim the color.
    if(hex === "#ffffff") return "#2d2d2d";
    // For pastel colors, we return hardcoded dark equivalents
    const idx = COLORS.indexOf(hex);
    if(idx > -1) return DARK_COLORS[idx];
    return "#333";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

function openExportModal() {
  const texts = [];
  document.querySelectorAll("#textContainer .note-card").forEach(card => {
    texts.push({
      content: card.querySelector("textarea").value,
      category: card.querySelector(".cat-input").value.trim(),
      color: card.dataset.color || "#ffffff"
    });
  });

  const images = [];
  document.querySelectorAll("#imageContainer img").forEach(img => {
      if(img.src) images.push(img.src);
  });

  const data = { texts, images };
  const json = JSON.stringify(data, null, 2);
  
  const scriptBlock = `<script id="portable-data" type="application/json">\n${json}\n<\/script>`;
  
  document.getElementById("exportText").value = scriptBlock;
  document.getElementById("exportModal").style.display = "flex";
}

function copyExport() {
    const box = document.getElementById("exportText");
    box.select();
    navigator.clipboard.writeText(box.value);
    showToast("Code Copied!");
}
</script>
</body>
</html>
